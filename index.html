<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fold Supply at Home</title>
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap">
<style>
@font-face{font-family:"Chillax";src:url("assets/fonts/chillax.woff2") format("woff2");font-weight:200 700;font-display:swap}
:root{
  /* Fold Supply brand tokens: every colour is a material */
  --studio:#F2F1EE; --graphite:#1E1F21; --muted:#5C5E62; --felt:#3A3B3D; --silver:#C9CACC; --kraft:#C9A57A; --studio-white:#ECEBE8; --lamp:#F0A74B;
  --paper:var(--studio); --ink:var(--graphite); --mute:var(--muted); --line:#DCDAD5; --panel:#FFFFFF; --focus:#0A5CD6;
  --note:var(--studio); --note-ink:var(--graphite); --note-mute:var(--muted); --ok:#146C43;
  --display:"Chillax",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Gentium Book Plus",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1E1F21; --ink:#ECEBE8; --mute:#C9CACC; --line:#3A3B3D; --panel:#2A2B2E; --focus:#8AB4FF; }
}
:root[data-theme="dark"]{ --paper:#1E1F21; --ink:#ECEBE8; --mute:#C9CACC; --line:#3A3B3D; --panel:#2A2B2E; --focus:#8AB4FF; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html.locked,html.locked body{overflow:hidden}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{font:inherit;color:inherit}
.skip{position:fixed;left:12px;top:-80px;z-index:90;background:#fff;color:#1E1F21;padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}

/* ---------- stage ---------- */
#bg{position:fixed;inset:-40px;z-index:0;background:#cfc6b9 center/cover no-repeat;filter:blur(16px) saturate(.95) brightness(.97);opacity:0;transition:opacity .5s}
#bg.on{opacity:1}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1;touch-action:pan-y}
html.pv-on #gl{touch-action:none;cursor:grab}
html.pv-on #gl.dragging{cursor:grabbing}
#gl.hot{cursor:pointer}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .3s}
#ui.gone{opacity:0;visibility:hidden}
svg#dims{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;overflow:visible}
svg#dims text{font:600 13px var(--display);fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.62);stroke-width:3.5px;stroke-linejoin:round}
.chips{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:6}
.chip{pointer-events:auto;background:rgba(22,20,18,.62);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:0}
.chips .right{display:flex;gap:8px}
.clock b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin-left:6px}
button.chip{cursor:pointer;min-height:36px}

/* caption: one line on the wall, more on request */
.cap{position:fixed;pointer-events:auto;z-index:7;max-width:440px;color:#1E1F21;background:rgba(242,241,238,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px;padding:12px 16px 14px;box-shadow:0 8px 26px rgba(20,12,6,.18);transition:top .45s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1)}
.cap.in{animation:capIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes capIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.steps{list-style:none;display:flex;gap:4px;margin:0 0 8px;padding:0}
.steps li{width:26px}
.steps button{display:block;width:100%;height:18px;padding:0;border:0;background:none;cursor:pointer;position:relative}
.steps button::after{content:"";position:absolute;left:0;right:0;top:7px;height:3px;border-radius:2px;background:#D9D3C8}
.steps button.done::after{background:#9A958C}
.steps button[aria-current="step"]::after{background:#1E1F21}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#5C5E62}
.cap h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.015em}
.cap h2{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.005em}
.cap .more{margin-top:8px;border:0;background:none;padding:0;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:#1E1F21;min-height:28px}
.cap .body{margin:8px 0 0;font-size:15.5px;line-height:1.5}
.cap .body[hidden]{display:none}
.cap .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #1E1F21;background:#1E1F21;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:#1E1F21}
.leader{stroke:#F2F1EE;stroke-width:1.5}

/* pins */
.pin{position:fixed;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;cursor:pointer;transition:opacity .25s;pointer-events:auto}
.pin span{background:#F2F1EE;color:#1E1F21;font-weight:700;font-size:14px;padding:8px 13px;border-radius:999px;box-shadow:0 6px 18px rgba(20,12,6,.3);white-space:nowrap}
.pin.info span{background:rgba(22,20,18,.72);color:#fff;font-weight:600}
.pin i{display:block;width:1.5px;height:20px;background:#F2F1EE;box-shadow:0 0 3px rgba(0,0,0,.4)}
.pin em{display:block;width:10px;height:10px;border-radius:50%;background:#F2F1EE;box-shadow:0 0 0 4px rgba(255,253,248,.35),0 1px 4px rgba(0,0,0,.4);margin-top:-5px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,253,248,0),0 1px 4px rgba(0,0,0,.4)}}
.pin.hide{opacity:0;pointer-events:none}
.pin:hover span,.pin:focus-visible span{background:#1E1F21;color:#fff}

/* ---------- product view ---------- */
#pv{position:fixed;inset:0;z-index:20;pointer-events:none}
#pv[hidden]{display:none}
#pv > *{pointer-events:auto}
.pv-back{position:fixed;top:14px;left:14px;z-index:22}
.pv-hint{position:fixed;left:16px;bottom:16px;background:rgba(22,20,18,.62);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}
.pv-panel{position:fixed;top:16px;right:16px;bottom:16px;width:420px;background:var(--note);color:#1E1F21;border-radius:14px;box-shadow:0 18px 50px rgba(20,12,6,.3);overflow:auto;overscroll-behavior:contain;padding:26px 28px 32px;transform-origin:100% 50%}
.pv-panel.unfold{animation:unfoldR .6s cubic-bezier(.2,.8,.2,1)}
@keyframes unfoldR{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.pv-panel h2{font-size:34px;line-height:1.05;margin:0 0 10px;letter-spacing:-.015em}
.pv-panel h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;margin:26px 0 8px;color:#5C5E62}
.pv-panel p{margin:0 0 10px}
.pv-panel .lead{font-size:17px}
.priceline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin:0 0 12px;font-variant-numeric:tabular-nums}
.priceline b{font-size:28px}
.stock{color:var(--ok);font-weight:600;font-size:15px}
.stock::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.ctrl{border:1px solid #E6E1D7;border-radius:10px;padding:14px 16px;margin:16px 0}
.ctrl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ctrl label,.ctrl .lbl{font-weight:700;font-size:15px}
.ctrl output{font-variant-numeric:tabular-nums;font-weight:700;font-size:19px}
.ctrl input[type=range]{width:100%;height:44px;margin:0;accent-color:#1E1F21}
.ends{display:flex;justify-content:space-between;font-size:13px;color:#5C5E62;margin-top:-8px}
.seg{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg button,.views button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #CFC9BE;background:#fff;font-weight:600;font-size:14px;cursor:pointer;color:#1E1F21}
.seg button[aria-pressed="true"],.views button[aria-pressed="true"]{background:#1E1F21;border-color:#1E1F21;color:#fff}
.views{display:flex;flex-wrap:wrap;gap:8px}
.add{width:100%;min-height:52px;font-size:16px;margin-top:6px}
.small{font-size:14px;color:#5C5E62}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs button{padding:0;border:0;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;background:#eee}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumbs button:hover img{transform:scale(1.05)}
dl.specs{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:15px}
dl.specs dt{color:#5C5E62}
dl.specs dd{margin:0;font-variant-numeric:tabular-nums}
.related{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.related button{text-align:left;min-height:48px;border:1px solid #CFC9BE;background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;color:#1E1F21}

#lb{position:fixed;inset:0;z-index:40;background:rgba(14,12,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px 24px}
#lb[hidden]{display:none}
#lb img{max-width:min(92vw,1100px);max-height:calc(100vh - 170px);object-fit:contain;border-radius:4px;display:block}
#lb p{color:#eee;margin:14px 0 0;text-align:center;max-width:60ch}
#lb .lb-ctrl{display:flex;gap:10px;margin-top:14px}
#lb .lb-close{position:fixed;top:14px;right:14px}
#lb .btn{background:#fff;color:#1E1F21;border-color:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:50;background:#1E1F21;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:600;transition:all .3s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:80;background:#E9E3D9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#1E1F21;transition:opacity .5s}
#loader.done{opacity:0;pointer-events:none}
#loader .bar{width:220px;height:3px;background:#D6CFC3;border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:100%;background:#1E1F21;transform:scaleX(0);transform-origin:0 50%;transition:transform .2s}
#fallback{position:fixed;inset:0;z-index:85;background:#E9E3D9;color:#1E1F21;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#fallback img{width:min(520px,80vw);border-radius:6px}
#track{position:relative;height:960vh;z-index:3;pointer-events:none}
footer.about{position:relative;z-index:10;background:var(--paper);color:var(--ink);padding:72px 24px 96px}
footer.about > div{max-width:980px;margin:0 auto}
footer.about h2{font-size:clamp(26px,3vw,36px);line-height:1.1;margin:0 0 14px}
footer.about ul{padding-left:20px;color:var(--mute);margin:0}
footer.about li{margin:8px 0}
footer.about li b{color:var(--ink)}

/* ---------- brand ---------- */
.chip,.eyebrow,.cap h1,.cap h2,.cap .more,.btn,.pin span,.pv-panel h2,.pv-panel h3,.seg button,.views button,.ctrl label,.ctrl .lbl,.related button,#toast,.pv-hint,footer.about h2,dl.specs dt,#loader p,.stock{font-family:var(--display);font-weight:600}
.cap h1,.cap h2,.pv-panel h2{letter-spacing:-.01em}
.clock b,.priceline b,.price{font-family:var(--body);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.brandchip{pointer-events:auto;display:flex;align-items:center;gap:10px;background:rgba(242,241,238,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px 8px 16px;transition:background .5s}
.brandchip img{height:20px;width:auto;display:block}
.brandchip .wm.eve{display:none}
.brandchip .proto{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-left:1px solid #CFCDC8;padding-left:10px}
.stop{display:inline-block;width:.3em;height:.3em;margin-left:.05em;vertical-align:baseline}
.cap .stop.eve{display:none}
.views button[aria-pressed="true"],.seg button[aria-pressed="true"]{position:relative;overflow:hidden}
.views button[aria-pressed="true"]::after,.seg button[aria-pressed="true"]::after{content:"";position:absolute;right:0;top:0;width:11px;height:11px;background:var(--silver);clip-path:polygon(0 0,100% 0,100% 100%)}
.picon{width:30px;height:30px;vertical-align:-8px;margin-right:6px}
.hicon{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
/* the fold, in 240 ms: plays when something is added to the bag */
.fold{display:inline-block;width:14px;height:14px;position:relative;vertical-align:-1px;margin-right:10px}
.fold::before,.fold::after{content:"";position:absolute;inset:0}
.fold::before{background:var(--felt);clip-path:polygon(0 0,100% 0,0 100%)}
.fold::after{background:var(--lamp);clip-path:polygon(0 100%,100% 100%,100% 0)}
#toast.on .fold::after{animation:fold .24s cubic-bezier(.3,.7,.3,1)}
@keyframes fold{from{clip-path:polygon(100% 0,100% 0,100% 0)}to{clip-path:polygon(0 100%,100% 100%,100% 0)}}
#toast{background:var(--graphite);color:var(--studio-white)}
/* evening: below the fold of the day, the interface turns graphite and lamp */
.eve .brandchip{background:rgba(30,31,33,.86)}
.eve .brandchip .wm.day{display:none}.eve .brandchip .wm.eve{display:block}
.eve .brandchip .proto{color:var(--silver);border-color:#4A4B4E}
.eve .cap{background:rgba(30,31,33,.9);color:var(--studio-white);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.eve .cap .eyebrow{color:var(--silver)}
.eve .cap .more{color:var(--studio-white)}
.eve .cap .stop.day{display:none}.eve .cap .stop.eve{display:inline-block}
.eve .cap .btn{background:var(--lamp);border-color:var(--lamp);color:var(--graphite)}
.eve .steps button::after{background:#4A4B4E}.eve .steps button.done::after{background:#8E8F92}.eve .steps button[aria-current="step"]::after{background:var(--lamp)}
.eve .chip{background:rgba(30,31,33,.78)}
footer .wm{height:26px;width:auto;display:block;margin-bottom:22px}
@media (max-width:760px){ .brandchip img{height:16px} .brandchip{padding:7px 12px} .brandchip .proto{display:none} }

@media (max-width:760px){
  .cap{left:10px !important;right:10px;top:auto !important;bottom:10px;max-width:none;padding:10px 14px 12px}
  .cap h1{font-size:25px}
  .cap h2{font-size:19px}
  .chip{font-size:12px;padding:6px 11px}
  .chip .long{display:none}
  .clock b{font-size:15px}
  .pv-panel{top:auto;left:0;right:0;bottom:0;width:auto;height:56vh;border-radius:16px 16px 0 0;padding:10px 18px 28px}
  .pv-panel::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#D6CFC3;margin:0 auto 12px}
  .pv-panel h2{font-size:28px}
  .pv-hint{bottom:auto;top:62px;left:14px;font-size:12px}
  .pin span{font-size:13px;padding:7px 11px}
}
/* ---------- R10: the desk-edge band and wall type ---------- */
.band{position:fixed;left:0;right:0;bottom:0;height:84px;z-index:30;background:var(--graphite);color:var(--studio-white);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:36px;padding:0 36px;border-top:1.5px solid var(--silver)}
.band button{background:none;border:0;color:inherit;cursor:pointer;font:600 15.5px var(--display);padding:8px 0;min-height:44px}
.band-logo img{height:21px;width:auto;display:block}
.band-links{display:flex;gap:30px;justify-content:center;flex-wrap:nowrap;overflow:hidden}
.band-links button{color:var(--silver);border-bottom:2px solid transparent}
.band-links button span{font:700 15px var(--body);color:var(--studio-white);margin-left:4px}
.band-links button:hover,.band-links button[aria-current="page"]{color:#fff;border-bottom-color:var(--studio-white)}
.band-bag{font-size:16px!important}
.eve .band-bag.has,.band-bag.has{color:var(--graphite)!important;background:var(--studio-white)!important;padding:0 16px!important}
.eve .band-bag.has{background:var(--lamp)!important}
.proto-tag{font:600 11px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:rgba(242,241,238,.78);padding:6px 10px;pointer-events:auto}
.eve .proto-tag{color:var(--silver);background:rgba(30,31,33,.7)}
.chip{border-radius:0}
/* captions: type straight on the wall */
.cap{background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:0;padding:0;max-width:560px;text-shadow:0 0 18px rgba(242,241,238,.95),0 0 4px rgba(242,241,238,.8)}
.cap h1{font-size:54px;line-height:1}
.cap h2{font-size:34px;line-height:1.05}
.cap .body{font-size:18px;max-width:46ch}
.cap .btn{text-shadow:none;border-radius:0}
.eve .cap{color:var(--studio-white);text-shadow:0 0 18px rgba(20,18,16,.9),0 0 4px rgba(20,18,16,.7)}
.btn{border-radius:0}
.pin span{border-radius:0}
#toast{bottom:104px;border-radius:0}
/* product sheet sits on the band: square, hard edge, felt corner */
.pv-panel{top:0;right:0;bottom:84px;border-radius:0;box-shadow:none;border-left:1.5px solid var(--graphite);background:var(--studio)}
.pv-panel::after{content:"";position:absolute;left:0;top:0;width:30px;height:30px;background:var(--felt);clip-path:polygon(0 0,100% 0,0 100%)}
.pv-back{border-radius:0}
.pv-hint{bottom:100px;border-radius:0}
#pv{z-index:20}
@media (max-width:760px){
  .proto-tag{font-size:10px;white-space:nowrap}.clock{white-space:nowrap}
  .band{height:112px;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:0 12px;padding:8px 16px 10px;align-content:center}
  .band-logo{display:none}
  .band-links{grid-column:1/-1;justify-content:space-between;gap:10px}
  .band-links .wide{display:none}
  .band-links button{font-size:14px}
  .band-links button[data-go="desk"]{display:none}
  .band-bag{grid-column:1/-1;justify-self:end}
  .cap{left:0!important;right:0;bottom:112px!important;top:auto!important;max-width:none;padding:12px 16px 14px;background:rgba(242,241,238,.94)!important;text-shadow:none;border-top:1.5px solid var(--graphite)}
  .eve .cap{background:rgba(30,31,33,.94)!important;text-shadow:none}
  .cap h1{font-size:28px}.cap h2{font-size:21px}
  .pv-panel{top:auto;bottom:112px;height:calc(58vh - 112px);border-left:0;border-top:1.5px solid var(--graphite)}
  .pv-panel::before{display:none}
  .pv-hint{top:62px;bottom:auto}
  #toast{bottom:126px}
}

@media (prefers-reduced-motion: reduce){
  .cap.in,.pv-panel.unfold{animation:none}
  .cap{transition:none}
  .pin em{animation:none}
}

/* R10 step 3: the product sheet as a spec sheet (R9-2) */
.pv-panel .ctrl{border:0;border-top:1.5px solid var(--graphite);border-bottom:1px solid #CFCDC8;border-radius:0;padding:14px 0 12px;margin:18px 0}
.pv-panel .ctrl output{font-family:var(--body);font-weight:700}
.pv-panel .ctrl input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;position:relative;z-index:1;cursor:pointer}
.pv-panel .ctrl input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--graphite)}
.pv-panel .ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:28px;margin-top:-13px;background:var(--graphite);border:0;border-radius:0;box-shadow:inset -6px 6px 0 -3px var(--silver)}
.pv-panel .ctrl input[type=range]::-moz-range-track{height:2px;background:var(--graphite)}
.pv-panel .ctrl input[type=range]::-moz-range-thumb{width:20px;height:28px;background:var(--graphite);border:0;border-radius:0}
.pv-panel .ctrl input[type=range]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ruler{position:relative;height:30px;margin:-12px 0 4px}

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SNAP = new URLSearchParams(location.search).has('snap'); // test hook: settle instantly
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ramp=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sstep=(a,b,t)=>{ t=ramp(t,a,b); return t*t*(3-2*t); };
const D2R=Math.PI/180;
const mobile=()=>innerWidth<=760;

/* Camera solved from the four desktop corners of plate P1 (desk units: mm, origin = centre of desktop, y up, z towards the camera) */
const CAL = {"W": 3072, "H": 2048, "fov": 29.7887, "pos": [-32.75, 1049.88, 1453.9], "quat": [-0.31300468043028307, -0.009662486879215237, 0.003064329712938996, 0.949697486707981], "f": 3850.0, "err": 3.412620252731813, "pitch": 36.474167565740636, "light": [2400, 1400, -500], "lamp": [-500, 175, -150], "keyI": 1.8, "lampI": 450000.0};

/* =========================================================
   Renderer, scene, light
   ========================================================= */
const canvas=$('#gl');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'}); }
catch(e){ $('#loader').style.display='none'; $('#fallback').style.display='flex'; throw e; }
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.VSMShadowMap;
renderer.setClearColor(0x000000,0);
renderer.autoClear=false;
THREE.Cache.enabled=true;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(CAL.fov,1,8,30000);
scene.add(camera);
const pmrem=new THREE.PMREMGenerator(renderer);

const manager=new THREE.LoadingManager();
manager.onProgress=(u,l,t)=>{$('#loadBar').style.transform=`scaleX(${l/t})`;};
const tl=new THREE.TextureLoader(manager);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function tex(name,rx,ry,linear){
  const t=tl.load('assets/tex/'+name);
  t.colorSpace=linear?THREE.NoColorSpace:THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=Math.min(8,maxAniso);
  return t;
}
/* captured interior light (CC0 HDRI), shipped as two lossless PNGs: RGB mantissa + exponent (RGBE) */
(function loadEnv(){
  manager.itemStart('env');
  const load=src=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  Promise.all([load('assets/env/room-rgb.png'),load('assets/env/room-e.png')]).then(([a,b])=>{
    const w=a.width,h=a.height, c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d',{willReadFrequently:true});
    g.drawImage(a,0,0); const A=g.getImageData(0,0,w,h).data; g.clearRect(0,0,w,h); g.drawImage(b,0,0); const B=g.getImageData(0,0,w,h).data;
    const out=new Uint16Array(w*h*4), H=v=>THREE.DataUtils.toHalfFloat(Math.min(v,65000)), one=H(1);
    for(let i=0;i<w*h;i++){ const e=B[4*i]; const s=e?Math.pow(2,e-136):0;
      out[4*i]=H((A[4*i]+.5)*s); out[4*i+1]=H((A[4*i+1]+.5)*s); out[4*i+2]=H((A[4*i+2]+.5)*s); out[4*i+3]=one; }
    const t=new THREE.DataTexture(out,w,h,THREE.RGBAFormat,THREE.HalfFloatType);
    t.colorSpace=THREE.LinearSRGBColorSpace; t.mapping=THREE.EquirectangularReflectionMapping; t.magFilter=t.minFilter=THREE.LinearFilter; t.needsUpdate=true;
    scene.environment=pmrem.fromEquirectangular(t).texture; t.dispose(); window.__env='ok';
  }).catch(e=>{ window.__env='fail'; console.error('environment failed',e); }).finally(()=>manager.itemEnd('env'));
})();

/* key light: the window on the right; evening: the desk lamp at the back left */
const key=new THREE.DirectionalLight(0xfff4e8,1.5);
key.position.set(CAL.light[0],CAL.light[1],CAL.light[2]);
key.castShadow=true;
key.shadow.mapSize.set(mobile()?1024:2048,mobile()?1024:2048);
Object.assign(key.shadow.camera,{left:-700,right:700,top:700,bottom:-700,near:100,far:8000});
key.shadow.radius=14; key.shadow.blurSamples=16; key.shadow.bias=-0.0006;
scene.add(key); scene.add(key.target);
const lamp=new THREE.PointLight(0xffa457,0,0,2);
lamp.position.set(CAL.lamp[0],CAL.lamp[1],CAL.lamp[2]);
scene.add(lamp);

/* =========================================================
   The photographed room: a plate glued to the camera frustum
   ========================================================= */
const plateTex={day:tl.load('assets/plates/day.webp'),eve:tl.load('assets/plates/eve.webp')};
for(const k in plateTex){ plateTex[k].colorSpace=THREE.NoColorSpace; plateTex[k].generateMipmaps=false; plateTex[k].minFilter=THREE.LinearFilter; }
const plateMat=new THREE.ShaderMaterial({
  uniforms:{tDay:{value:plateTex.day},tEve:{value:plateTex.eve},mixE:{value:0},opacity:{value:1}},
  vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'uniform sampler2D tDay,tEve; uniform float mixE,opacity; varying vec2 vUv; void main(){ vec3 a=texture2D(tDay,vUv).rgb, b=texture2D(tEve,vUv).rgb; gl_FragColor=vec4(mix(a,b,mixE),opacity); }',
  depthTest:false,depthWrite:false,transparent:true,toneMapped:false
});
const PLATE_D=20000;
const plateH=2*PLATE_D*Math.tan(CAL.fov*D2R/2), plateW=plateH*CAL.W/CAL.H;
const plate=new THREE.Mesh(new THREE.PlaneGeometry(plateW,plateH),plateMat);
plate.renderOrder=-1000; plate.frustumCulled=false;
const bgScene=new THREE.Scene(); bgScene.add(plate); // drawn first, in its own pass
const _fw=new THREE.Vector3();
function syncPlate(){ camera.getWorldDirection(_fw); plate.position.copy(camera.position).addScaledVector(_fw,PLATE_D); plate.quaternion.copy(camera.quaternion); }

/* shadow catcher on the photographed desktop */
const catcherMat=new THREE.ShadowMaterial({opacity:.34,transparent:true});
const catcher=new THREE.Mesh(new THREE.PlaneGeometry(1200,600),catcherMat);
catcher.rotation.x=-Math.PI/2; catcher.position.y=.05; catcher.receiveShadow=true; scene.add(catcher);

/* the photographed desk as an invisible depth mask, so anything below the desktop stays hidden */
const occluder=new THREE.Mesh(new THREE.BoxGeometry(1200,740,600),new THREE.MeshBasicMaterial({colorWrite:false}));
occluder.position.y=-370.2; occluder.renderOrder=-500; scene.add(occluder);

/* a real 3D desk, only seen once the camera leaves the photo (product pages) */
const deskMat=new THREE.MeshStandardMaterial({map:tex('oak.jpg',2,1),bumpMap:tex('oak-bump.jpg',2,1,true),bumpScale:.35,roughness:.58,envMapIntensity:.6,transparent:true,opacity:0});
const desk3d=new THREE.Mesh(new RoundedBoxGeometry(1200,24,600,2,2),deskMat);
desk3d.position.y=-12.05; desk3d.receiveShadow=true; desk3d.visible=false; scene.add(desk3d);

const PICK=[];
function mk(geo,mat,prod){ const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true; if(prod){m.userData.prod=prod; PICK.push(m);} return m; }

/* =========================================================
   Contact shadows: depth seen from under the products, blurred
   ========================================================= */
const CS={w:1300,d:700,res:mobile()?256:512,far:70,y:3.15};
const csRT=new THREE.WebGLRenderTarget(CS.res,Math.round(CS.res*CS.d/CS.w)); csRT.texture.generateMipmaps=false;
const csRT2=new THREE.WebGLRenderTarget(CS.res,Math.round(CS.res*CS.d/CS.w)); csRT2.texture.generateMipmaps=false;
const csCam=new THREE.OrthographicCamera(-CS.w/2,CS.w/2,CS.d/2,-CS.d/2,0,CS.far);
csCam.rotation.x=Math.PI/2; csCam.position.y=CS.y; scene.add(csCam);
const csDepth=new THREE.MeshDepthMaterial(); csDepth.depthTest=false; csDepth.depthWrite=false;
csDepth.onBeforeCompile=sh=>{ sh.fragmentShader=sh.fragmentShader.replace('gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );','gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * 1.6 );'); };
const csPlaneMat=new THREE.MeshBasicMaterial({map:csRT.texture,transparent:true,opacity:.62,depthWrite:false,toneMapped:false});
const csPlane=new THREE.Mesh(new THREE.PlaneGeometry(CS.w,CS.d).rotateX(Math.PI/2),csPlaneMat);
csPlane.scale.y=-1; csPlane.position.y=CS.y+.15; csPlane.renderOrder=-10; scene.add(csPlane);
const blurCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const hBlur=new THREE.ShaderMaterial(HorizontalBlurShader), vBlur=new THREE.ShaderMaterial(VerticalBlurShader);
hBlur.depthTest=vBlur.depthTest=false;
const blurQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),hBlur); const blurScene=new THREE.Scene(); blurScene.add(blurQuad);
const csHidden=[];
function renderContact(){
  const hide=[plate,catcher,csPlane,desk3d,occluder,...csHidden], was=hide.map(o=>o.visible);
  hide.forEach(o=>o.visible=false);
  scene.overrideMaterial=csDepth;
  renderer.setRenderTarget(csRT); renderer.setClearColor(0x000000,0); renderer.clear(); renderer.render(scene,csCam);
  scene.overrideMaterial=null;
  hide.forEach((o,i)=>o.visible=was[i]);
  for(let i=0;i<2;i++){
    blurQuad.material=hBlur; hBlur.uniforms.tDiffuse.value=csRT.texture; hBlur.uniforms.h.value=(i?2.2:3.2)/256;
    renderer.setRenderTarget(csRT2); renderer.clear(); renderer.render(blurScene,blurCam);
    blurQuad.material=vBlur; vBlur.uniforms.tDiffuse.value=csRT2.texture; vBlur.uniforms.v.value=(i?2.2:3.2)/256;
    renderer.setRenderTarget(csRT); renderer.clear(); renderer.render(blurScene,blurCam);
  }
  renderer.setRenderTarget(null);
}

/* =========================================================
   Mat: 700 x 350 x 3 mm felt, 12 mm corners, rolls around its 350 mm edge
   ========================================================= */
const MAT={w:700,d:350,r:12,t:3};
const ROLL={a:13,b:3.5/(2*Math.PI)};
function maskShader(mat){
  mat.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec2 aFlat;\nvarying vec2 vFlat;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvFlat=aFlat;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec2 vFlat;')
      .replace('void main() {','void main() {\n  vec2 q=abs(vFlat)-vec2(338.0,163.0); float dd=length(max(q,0.0))+min(max(q.x,q.y),0.0)-12.0; if(dd>0.0) discard;');
  };
}
const feltMat=new THREE.MeshStandardMaterial({map:tex('felt.jpg',7,3.5),normalMap:tex('felt-normal.jpg',7,3.5,true),normalScale:new THREE.Vector2(.9,.9),roughnessMap:tex('felt-rough.jpg',7,3.5,true),roughness:1,metalness:0,envMapIntensity:.2,side:THREE.DoubleSide});
maskShader(feltMat);
const feltDepth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking}); maskShader(feltDepth);
const feltEdgeMat=new THREE.MeshStandardMaterial({map:tex('felt.jpg',1,1),bumpMap:tex('felt-bump.jpg',1,1,true),bumpScale:1.2,roughness:1,envMapIntensity:.2,side:THREE.DoubleSide});

const matGroup=new THREE.Group(); scene.add(matGroup);
function gridGeo(){
  const g=new THREE.PlaneGeometry(MAT.w,MAT.d,240,6); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, base=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){ base[2*i]=p.getX(i); base[2*i+1]=p.getZ(i); }
  g.setAttribute('aFlat',new THREE.BufferAttribute(base.slice(),2));
  g.userData.base=base; return g;
}
const matTop=mk(gridGeo(),feltMat,'mat'); matTop.customDepthMaterial=feltDepth; matTop.userData.n=1.5;
const matBot=mk(gridGeo(),feltMat,'mat'); matBot.customDepthMaterial=feltDepth; matBot.userData.n=-1.5; matBot.castShadow=false;
function perimeter(){
  const pts=[],hw=MAT.w/2,hd=MAT.d/2,r=MAT.r,step=3;
  const seg=(x0,z0,x1,z1)=>{const n=Math.max(1,Math.round(Math.hypot(x1-x0,z1-z0)/step)); for(let i=0;i<n;i++) pts.push([x0+(x1-x0)*i/n,z0+(z1-z0)*i/n]);};
  const arc=(cx,cz,a0,a1)=>{for(let i=0;i<8;i++){const a=a0+(a1-a0)*i/8; pts.push([cx+r*Math.cos(a),cz+r*Math.sin(a)]);}};
  seg(-hw+r,hd,hw-r,hd); arc(hw-r,hd-r,Math.PI/2,0); seg(hw,hd-r,hw,-hd+r); arc(hw-r,-hd+r,0,-Math.PI/2);
  seg(hw-r,-hd,-hw+r,-hd); arc(-hw+r,-hd+r,-Math.PI/2,-Math.PI); seg(-hw,-hd+r,-hw,hd-r); arc(-hw+r,hd-r,Math.PI,Math.PI/2);
  return pts;
}
const edgeGeo=(()=>{
  const P=perimeter(), N=P.length, pos=new Float32Array(N*2*3), uv=new Float32Array(N*2*2), base=new Float32Array(N*2*2), nn=new Float32Array(N*2), idx=[];
  let L=0;
  for(let i=0;i<N;i++){
    if(i>0) L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);
    for(let k=0;k<2;k++){ const v=2*i+k; base[2*v]=P[i][0]; base[2*v+1]=P[i][1]; nn[v]=k?-1.5:1.5; uv[2*v]=L/100; uv[2*v+1]=k?0:.03; }
    const j=(i+1)%N, a=2*i,b=2*i+1,c=2*j,d=2*j+1; idx.push(a,b,c,b,d,c);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setIndex(idx);
  g.userData.base=base; g.userData.nn=nn; return g;
})();
const matEdge=mk(edgeGeo,feltEdgeMat,'mat'); matEdge.castShadow=false;
matGroup.add(matTop,matBot,matEdge);

const V=new THREE.Vector3();
function rollPos(x,z,n,u,out){
  const Lr=u*MAT.w, Xc=MAT.w/2-Lr;
  if(Lr<0.01||x<=Xc){ out.set(x,1.5+n,z); return out; }
  const a=ROLL.a,b=ROLL.b;
  const thT=(-a+Math.sqrt(a*a+2*b*Lr))/b, rT=a+b*thT;
  const sig=Lr-(x-Xc);
  const th=(-a+Math.sqrt(a*a+2*b*Math.max(0,sig)))/b;
  const rr=a+b*th-n, al=-Math.PI/2+(thT-th);
  out.set(Xc+rr*Math.cos(al),1.5+rT+rr*Math.sin(al),z); return out;
}
let matUApplied=-1;
function setMatRoll(u){
  if(Math.abs(u-matUApplied)<1e-4) return; matUApplied=u;
  for(const m of [matTop,matBot]){
    const g=m.geometry,p=g.attributes.position,base=g.userData.base,n=m.userData.n;
    for(let i=0;i<p.count;i++){ rollPos(base[2*i],base[2*i+1],n,u,V); p.setXYZ(i,V.x,V.y,V.z); }
    p.needsUpdate=true; g.computeVertexNormals(); g.computeBoundingSphere(); g.computeBoundingBox();
  }
  const g=matEdge.geometry,p=g.attributes.position,base=g.userData.base,nn=g.userData.nn;
  for(let i=0;i<p.count;i++){ rollPos(base[2*i],base[2*i+1],nn[i],u,V); p.setXYZ(i,V.x,V.y,V.z); }
  p.needsUpdate=true; g.computeVertexNormals(); g.computeBoundingSphere();
}
function matRollCentre(u){ // world-ish centre of the roll (group local)
  const Lr=u*MAT.w, a=ROLL.a,b=ROLL.b, thT=(-a+Math.sqrt(a*a+2*b*Lr))/b, rT=a+b*thT;
  return new THREE.Vector3(MAT.w/2-Lr,1.5+rT,0);
}

/* =========================================================
   Stand: aluminium rails, silicone pads, scissor legs, crossbars
   rear height 110 mm open, 22 mm envelope folded
   ========================================================= */

  swipe:'<svg viewBox="0 0 22 22" aria-hidden="true"><g class="swipe"><path d="M11 18V5M7 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></g></svg>',
  tap:'<svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="3" fill="currentColor"/><circle cx="11" cy="11" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".55"/></svg>',
  done:'<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 3h16L3 19z" fill="#C9CACC"/><path d="M3 19h16V3z" fill="currentColor"/></svg>'
};
const MOVE=touch?'Swipe up':'Scroll';
const GUIDE={
  start:[touch?'swipe':'scroll',`This desk is the shop. ${MOVE} to set it out.`],
  setting:[touch?'swipe':'scroll',`Keep going. The desk sets itself out.`],
  explore:['tap',`${touch?'Tap':'Click'} anything with a label to look closer. Or keep going to six.`],
  closing:[touch?'swipe':'scroll',`Keep going to finish the day.`],
  end:['done',`That’s the day. Open anything, or`]
};
let gKey='', gIdle=0, lastP=-1;
function guideState(){
  if(mode!=='story'||page||trans>0) return '';
  const p=pCur;
  if(p<.03) return 'start';
  if(p>=.905) return 'end';
  if(EXPLORE(p)) return 'explore';
  return p<.515?'setting':'closing';
}
function syncGuide(){
  const k=guideState();
  // while the desk is moving, the guide steps back; it returns when you pause
  const moving=Math.abs(pCur-lastP)>.0004; lastP=pCur;
  gIdle=moving?0:gIdle+1;
  const quiet=(k==='setting'||k==='closing')&&gIdle<40;
  guide.classList.toggle('off',!k||quiet);
  if(k===gKey) return; gKey=k; if(!k) return;
  const [ic,txt]=GUIDE[k];
  guide.innerHTML=ICON[ic]+`<span>${txt}</span>`+(k==='end'?`<button class="gbtn" type="button" data-again>start the morning again ↑</button>`:'');
}
guide.addEventListener('click',e=>{ if(e.target.closest('[data-again]')) goToP(0); });

/* ---- labels: no overlaps, nothing over the caption, clock or rail ---- */
const PREF={mat:['up','down','right','left'],stand:['up','right','left','down'],clips:['up','down','left','right'],
  help:['up','right','down'],approach:['right','left','down'],delivery:['left','up','down'],lamp:['right','up','down'],box:['up','left','right']};
const placed={};
const shown=el=>!!el&&el.getClientRects().length>0&&getComputedStyle(el).visibility!=='hidden';
const rectOf=el=>{ const r=el.getBoundingClientRect(); return {x0:r.left,y0:r.top,x1:r.right,y1:r.bottom}; };
const hit=(a,b,m=6)=>a.x0<b.x1+m&&a.x1>b.x0-m&&a.y0<b.y1+m&&a.y1>b.y0-m;
function labelRect(pl,x,y,w,h){
  if(pl==='up') return {x0:x-w/2,y0:y-22-h,x1:x+w/2,y1:y-22};
  if(pl==='down') return {x0:x-w/2,y0:y+17,x1:x+w/2,y1:y+17+h};
  if(pl==='left') return {x0:x-18-w,y0:y-h/2,x1:x-18,y1:y+h/2};
  return {x0:x+18,y0:y-h/2,x1:x+18+w,y1:y+h/2};
}
function layoutPins(){
  const bandH=$('#band').offsetHeight;
  const obstacles=[];
  for(const el of [$('#subs')||capEl,$('.chips .clock'),$('.chips .left')]){ if(shown(el)&&!el.classList.contains('off')){ const r=rectOf(el); if(r.x1>r.x0) obstacles.push(r); } }
  if(shown(rail)) obstacles.push({x0:size.w-150,y0:70,x1:size.w,y1:size.h-bandH});
  const list=[];
  for(const id of ['mat','stand','clips']) list.push([id,pins[id]]);
  for(const k in roomPins) list.push([k,roomPins[k]]);
  list.push(['box',boxPin]);
  pins.laptop.classList.add('hide'); pins.laptop.tabIndex=-1; pins.laptop.setAttribute('aria-hidden','true');
  const dots=list.filter(([,b])=>!b.classList.contains('hide')).map(([,b])=>{ const x=parseFloat(b.style.left), y=parseFloat(b.style.top); return {x0:x-7,y0:y-7,x1:x+7,y1:y+7}; });
  const done=[];
  for(const [id,b] of list){
    if(b.classList.contains('hide')) continue;
    const x=parseFloat(b.style.left), y=parseFloat(b.style.top), sp=b.firstElementChild;
    sp.style.transform='';
    if(b.classList.contains('room')&&obstacles.some(o=>x>o.x0-10&&x<o.x1+10&&y>o.y0-10&&y<o.y1+10)){ b.classList.add('hide'); b.tabIndex=-1; continue; }
    const w=sp.offsetWidth, h=sp.offsetHeight;
    const order=[...(PREF[id]||['up','down','right','left'])]; if(placed[id]) order.unshift(placed[id]);
    let best=null, bestScore=1e9;
    for(const pl of order){
      const r=labelRect(pl,x,y,w,h);
      let s=0;
      if(r.x0<8||r.x1>size.w-8||r.y0<8||r.y1>size.h-bandH-8) s+=1000;
      for(const o of obstacles) if(hit(r,o)) s+=400;
      for(const o of done) if(hit(r,o)) s+=300;
      for(const d of dots) if(hit(r,d,0)) s+=50;
      if(s<bestScore){ bestScore=s; best=[pl,r]; }
      if(s===0) break;
    }
    const [pl,r]=best; placed[id]=pl;
    b.classList.remove('pl-down','pl-left','pl-right'); if(pl!=='up') b.classList.add('pl-'+pl);
    // still off-screen sideways? slide the label, keep the dot
    let dx=0; if(r.x0<8) dx=8-r.x0; else if(r.x1>size.w-8) dx=size.w-8-r.x1;
    if(dx&&(pl==='up'||pl==='down')) sp.style.transform=`translateX(${dx.toFixed(1)}px)`;
    done.push({x0:r.x0+dx,y0:r.y0,x1:r.x1+dx,y1:r.y1});
  }
}

const MOVE=matchMedia('(hover:none)').matches?'Swipe up':'Scroll';
Object.assign(GUIDE,{
  start:[GUIDE.start[0],`${MOVE} to set out the desk`],
  setting:[GUIDE.setting[0],`${MOVE} on, or stop any time`],
  explore:['tap',`${matchMedia('(hover:none)').matches?'Tap':'Click'} a label to see it up close`],
  closing:[GUIDE.closing[0],`${MOVE} on to finish the day`],
  end:['done','That’s the day']
});
gKey='';

/* ---------- 3. play the day ---------- */
const HOLD={0:2200,1:2600,2:2600,3:2600,4:4200,5:2600,6:3000};
let playing=false, plan=[], seg=0, segT0=0;
const pNow=()=>{ const tr=$('#track'), max=tr.offsetHeight-innerHeight; return clamp((scrollY-tr.offsetTop)/max,0,1); };
const pGo=p=>{ const tr=$('#track'), max=tr.offsetHeight-innerHeight; scrollTo(0,tr.offsetTop+p*max); };
function buildPlan(from){
  const stops=STEPS.map((s,k)=>({p:k?Math.min(.999,s.at+.012):0,k})).concat([{p:1,k:6}]);
  const out=[]; let cur=from;
  for(const s of stops){ if(s.p<=from+.004) continue; out.push({a:cur,b:s.p,dur:RM?0:Math.max(900,(s.p-cur)*16000)}); out.push({hold:HOLD[s.k]||2600}); cur=s.p; }
  return out;
}
function setPlay(){ play.classList.toggle('on',playing);
  const atEnd=pNow()>.995;
  play.innerHTML=playing?'<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="3.5" height="10" fill="currentColor"/><rect x="7.5" y="1" width="3.5" height="10" fill="currentColor"/></svg>Pause':
    `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>${atEnd?'Play again':'Play the day'}`;
  play.setAttribute('aria-pressed',playing); }
function startPlay(){ let from=pNow(); if(from>.995){ pGo(0); from=0; } plan=buildPlan(from); seg=0; segT0=performance.now(); playing=true; setPlay(); }
function stopPlay(){ if(!playing) return; playing=false; setPlay(); }
play.addEventListener('click',()=>playing?stopPlay():startPlay());
(function tick(t){
  if(playing){
    if(mode!=='story'||page){ stopPlay(); }
    else { const s=plan[seg];
      if(!s){ stopPlay(); }
      else { const e=t-segT0;
        if(s.hold!=null){ if(e>=s.hold){ seg++; segT0=t; } }
        else { const k=s.dur?clamp(e/s.dur,0,1):1; pGo(lerp(s.a,s.b,ease(k))); if(k>=1){ seg++; segT0=t; } } } }
  }
  requestAnimationFrame(tick);
})(0);
// any input of your own takes over
const takeOver=()=>stopPlay();
addEventListener('wheel',takeOver,{passive:true}); addEventListener('touchstart',takeOver,{passive:true});
addEventListener('keydown',e=>{ if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key)&&e.target===document.body) takeOver(); });
canvas.addEventListener('pointerdown',takeOver);
$('#pins').addEventListener('click',takeOver,true); rail.addEventListener('click',takeOver,true);
addEventListener('scroll',()=>{ if(!playing) setPlay(); },{passive:true});
setPlay();

    <li>${I('<circle cx="13" cy="13" r="4" fill="currentColor"/><circle cx="13" cy="13" r="10" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/>')}<span><b>${matchMedia('(hover:none)').matches?'Tap':'Click'} anything with a label.</b> Turn it, fold it, roll it, see its sizes, and add it to your bag.</span></li>
    <li>${I('<rect x="3" y="6" width="20" height="15" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 6l4-4h12l4 4" fill="none" stroke="currentColor" stroke-width="1.8"/>')}<span><b>The room holds the rest.</b> The notebook is help, the framed print is our approach, the window is delivery. Your bag is a box on the desk.</span></li>

</div>`;
document.body.appendChild(intro);
let introFocus=null;
function showIntro(){ introFocus=document.activeElement; intro.hidden=false; document.documentElement.classList.add('locked'); setTimeout(()=>intro.querySelector('[data-intro="play"]').focus(),RM?0:60); }
function hideIntro(){ intro.hidden=true; document.documentElement.classList.remove('locked'); try{ localStorage.setItem('fold-intro','1'); }catch(e){} }
intro.addEventListener('click',e=>{ const b=e.target.closest('[data-intro]'); if(!b) return; const a=b.dataset.intro; hideIntro();
  if(a==='play'){ pGo(0); setTimeout(startPlay,RM?0:350); } else if(a==='about'){ openPage('about'); } else { setTimeout(()=>tag.focus(),50); } });
intro.addEventListener('keydown',e=>{ if(e.key==='Escape'){ hideIntro(); } if(e.key==='Tab'){ const f=[...intro.querySelectorAll('button')]; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey&&i===f.length-1){ e.preventDefault(); f[0].focus(); } } });
how.addEventListener('click',()=>{ stopPlay(); showIntro(); });
{ let seen=false; try{ seen=localStorage.getItem('fold-intro')==='1'; }catch(e){}
  const q=new URLSearchParams(location.search);
  const want=q.has('intro')||(!seen&&!q.has('snap')&&!location.hash);
  if(want){ const go=()=>setTimeout(showIntro,RM?0:500); if($('#loader')&&!$('#loader').classList.contains('done')){ const mo=new MutationObserver(()=>{ if($('#loader').classList.contains('done')){ mo.disconnect(); go(); } }); mo.observe($('#loader'),{attributes:true}); } else go(); } }
